name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate Supabase client configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const url = process.env.SUPABASE_URL;
          const anonKey = process.env.SUPABASE_PUBLISHABLE_KEY;

          if (!url || !anonKey) {
            throw new Error('Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets.');
          }

          const config = { url, anonKey };
          fs.mkdirSync('_site', { recursive: true });
          fs.writeFileSync(
            '_site/supabase-config.js',
            `window.BUDGET_TRACKER_SUPABASE_CONFIG = ${JSON.stringify(config)};\n`
          );
          NODE
          cp index.html index.js style.css _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
